<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>VidRecorder Lite</title>
<meta name="theme-color" content="#16161a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --accent: #FFB000; --panel: #16161a; --stroke: #2a2a31; --red: #ff3b3b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0a0c; color: #e8e8ee; overflow: hidden;
    font-family: "Barlow Condensed", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--stroke); flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-weight: 700; letter-spacing: 0.22em; font-size: 16px; white-space: nowrap; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #444; flex-shrink: 0; }
  .dot.live { background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1.1s infinite; }

  #projectWrap { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; }
  #projectName {
    flex: 1; min-width: 0; height: 40px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--stroke); background: #0f0f12; color: #fff; outline: none;
    font-family: "Archivo", sans-serif; font-size: 16px; font-weight: 600;
  }
  #projectName:focus { border-color: var(--accent); }
  #projectName:disabled { opacity: .6; }
  #today { font-family: "JetBrains Mono", monospace; font-size: 12px; color: #7c7c86; white-space: nowrap; }

  .tabs { display: flex; border: 1px solid var(--stroke); border-radius: 10px; overflow: hidden; }
  .tab {
    height: 40px; padding: 0 14px; background: #1d1d22; color: #9a9aa4; border: none; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .tab + .tab { border-left: 1px solid var(--stroke); }
  .tab.sel { background: color-mix(in srgb, var(--accent) 14%, #1d1d22); color: var(--accent); }

  .lbl { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #7c7c86; }
  .readout { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--accent); min-width: 42px; text-align: right; }
  .group { display: flex; align-items: center; gap: 9px; }

  /* ---- buttons ---- */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px; min-width: 44px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--stroke); background: #1d1d22; color: #cfcfd6;
    cursor: pointer; transition: all .15s; font-family: inherit; font-size: 15px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: #3a3a44; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .btn svg { width: 19px; height: 19px; flex-shrink: 0; }
  .btn.icon { padding: 0; width: 44px; }
  .btn.primary { background: var(--accent); color: #0a0a0c; border: none; }
  .btn.danger:hover:not(:disabled) { border-color: #5a2630; color: #ff9aa6; }

  #recBtn {
    height: 56px; padding: 0 22px; border-radius: 28px; font-size: 16px;
    background: #1d1d22; border: 2px solid var(--red); color: #ff6b6b;
  }
  #recBtn svg { width: 22px; height: 22px; }
  #recBtn.active { background: var(--red); color: #fff; box-shadow: 0 0 24px rgba(255,59,59,.45); }

  /* ---- stage ---- */
  #stage {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, #111114 0%, #050506 100%);
  }
  #video, #playback {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; transform: scaleX(-1);
  }
  #video { z-index: 0; opacity: 0; transition: opacity .3s; }
  #video.on { opacity: 1; }
  #playback { z-index: 10; background: #000; display: none; cursor: pointer; }
  #stage.reviewing #playback { display: block; }
  #stage.reviewing .prompter { display: none !important; }
  #vscrim { position: absolute; inset: 0; z-index: 1; pointer-events: none; display: none; }
  #stage.tele.camon #vscrim { display: block; }

  #noCam {
    position: absolute; inset: 0; z-index: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; color: #5f5f68; text-align: center; padding: 20px;
  }
  #noCam .lbl { font-size: 13px; }
  #stage.camon #noCam { display: none; }
  #stage.tele #noCam { display: none; }

  .prompter { display: none; }
  #stage.tele .prompter { display: block; }
  #stage.tele #readline.prompter { display: flex; }
  #scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: 0.5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 2px, transparent 4px);
  }
  #readline {
    position: absolute; top: 42%; left: 0; right: 0; z-index: 3; pointer-events: none;
    align-items: center; justify-content: space-between;
  }
  #readline .rule { flex: 1; height: 1px; margin: 0 8px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 33%, transparent) 20%, color-mix(in srgb, var(--accent) 33%, transparent) 80%, transparent); }
  .tri { width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin: 0 6px; filter: drop-shadow(0 0 6px var(--accent)); }
  .tri.r { border-left: 15px solid var(--accent); }
  .tri.l { border-right: 15px solid var(--accent); }

  #content { position: relative; z-index: 2; will-change: transform; transform-origin: center center; padding: 0 24px; }
  #content .spacer-top { height: 42vh; }
  #content .spacer-bottom { height: 85vh; }
  #script {
    margin: 0 auto; white-space: pre-wrap; text-align: center;
    font-weight: 600; color: var(--accent); text-shadow: 0 0 24px color-mix(in srgb, var(--accent) 20%, transparent);
  }

  /* recording / review badges */
  #recBadge, #reviewBadge {
    position: absolute; top: 14px; left: 14px; z-index: 12; display: none; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.6);
    font-family: "JetBrains Mono", monospace; font-size: 13px;
  }
  #recBadge { color: #ff6b6b; }
  #recBadge.on { display: flex; }
  #recBadge .rd { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 1.1s infinite; }
  #reviewBadge { color: var(--accent); }
  #stage.reviewing #reviewBadge { display: flex; }
  #liveBtn { position: absolute; top: 10px; right: 14px; z-index: 12; display: none; height: 38px; background: rgba(0,0,0,.6); }
  #stage.reviewing #liveBtn { display: flex; }

  #countdown {
    position: absolute; inset: 0; z-index: 15; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,0.55);
  }
  #countdown span {
    font-family: "JetBrains Mono", monospace; font-size: 140px; font-weight: 700;
    color: var(--accent); text-shadow: 0 0 40px var(--accent);
  }
  .pop { animation: pop .8s ease-out; }

  #toast {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 30;
    max-width: 86%; display: none; align-items: center; gap: 10px; padding: 10px 14px;
    border-radius: 10px; background: #16161a; border: 1px solid var(--stroke); color: #e8e8ee;
    font-size: 15px; letter-spacing: 0.03em; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #toast.err { background: #241015; border-color: #5a2630; color: #ff9aa6; }
  #toast.on { display: flex; }
  #toast button { background: none; border: none; color: inherit; cursor: pointer; display: flex; font-size: 15px; }

  /* ---- takes strip ---- */
  #takesBar {
    display: flex; align-items: center; gap: 10px; padding: 8px 16px;
    background: #111114; border-top: 1px solid var(--stroke); flex-shrink: 0; min-height: 52px;
  }
  #takes { display: flex; gap: 8px; overflow-x: auto; flex: 1; padding: 2px 0; scrollbar-width: thin; }
  #takes .empty { font-size: 14px; color: #5f5f68; letter-spacing: 0.04em; padding: 6px 0; }
  .take {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px;
    border-radius: 8px; border: 1px solid var(--stroke); background: #1d1d22; color: #cfcfd6;
    cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
  }
  .take .meta { font-family: "JetBrains Mono", monospace; font-size: 11px; color: #7c7c86; font-weight: 500; }
  .take .ok { color: #52FA7C; font-size: 13px; }
  .take.sel { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, #1d1d22); }

  /* ---- transport ---- */
  #transport {
    display: flex; align-items: center; gap: 14px; padding: 12px 16px; flex-wrap: wrap;
    background: var(--panel); border-top: 1px solid var(--stroke); flex-shrink: 0;
  }
  #takeInfo { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 6px; }
  #takeName { font-family: "Archivo", sans-serif; font-size: 16px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #takeSub { font-family: "JetBrains Mono", monospace; font-size: 12px; color: #7c7c86; }
  #seekRow { display: flex; align-items: center; gap: 10px; }
  #seekRow .readout { min-width: 88px; text-align: left; color: #9a9aa4; }

  /* ---- prompter controls ---- */
  #prompterBar {
    display: none; align-items: center; gap: 16px; padding: 10px 16px; flex-wrap: wrap;
    background: #121215; border-top: 1px solid var(--stroke); flex-shrink: 0;
  }
  #prompterBar.on { display: flex; }
  #speedWrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }

  /* ---- settings drawer ---- */
  #settings {
    background: var(--panel); border-top: 1px solid var(--stroke);
    padding: 16px 18px; display: none; flex-wrap: wrap; gap: 22px; align-items: center; flex-shrink: 0;
  }
  #settings.open { display: flex; }
  .ctrl { display: flex; align-items: center; gap: 9px; min-width: 190px; }
  .ctrl .name { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #7c7c86; white-space: nowrap; }
  .ctrl .ico { color: #7c7c86; display: flex; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid var(--stroke); }
  .swatch.sel { border-color: #fff; }
  .fontbtn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--stroke);
    background: #1d1d22; color: #cfcfd6; cursor: pointer; font-size: 14px; text-transform: capitalize; }
  .fontbtn.sel { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .toggle { height: 32px; padding: 0 16px; min-width: 56px; }

  /* ---- range inputs ---- */
  input[type=range] {
    -webkit-appearance: none; appearance: none; height: 4px; border-radius: 99px;
    background: #33333c; outline: none; cursor: pointer; flex: 1; min-width: 80px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 3px solid #0a0a0c; box-shadow: 0 0 0 1px var(--accent); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
    border: 3px solid #0a0a0c; cursor: pointer;
  }
  input[type=range]:disabled { opacity: .35; cursor: default; }

  /* ---- editor ---- */
  #editor {
    position: absolute; inset: 0; z-index: 40; background: rgba(6,6,8,0.95);
    display: none; flex-direction: column; padding: 18px;
  }
  #editor.open { display: flex; }
  #editor .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  #editor h2 { font-weight: 700; letter-spacing: 0.2em; font-size: 16px; }
  #editor textarea {
    flex: 1; width: 100%; resize: none; background: #101013; border: 1px solid var(--stroke);
    border-radius: 12px; color: #e8e8ee; padding: 18px; font-family: "Archivo", sans-serif;
    font-size: 18px; line-height: 1.6; outline: none;
  }
  #editor .tip { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #7c7c86; margin-top: 10px; }

  @media (max-width: 640px) {
    header { padding: 8px 12px; gap: 10px; }
    #projectWrap { order: 3; flex-basis: 100%; }
    #today { display: none; }
    .brand h1 { font-size: 14px; }
    #transport { padding: 10px 12px; gap: 10px; }
    #takeInfo { flex-basis: 100%; }
    .btn .txt { display: none; }
    .btn:not(.icon) { padding: 0 12px; }
    #recBtn .txt { display: inline; }
    #transport .group { flex: 1; justify-content: space-between; }
  }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.82)} }
  @keyframes pop { 0%{opacity:0;transform:scale(.4)} 30%{opacity:1;transform:scale(1.08)} 100%{opacity:0;transform:scale(.85)} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="dot" id="recDot"></span>
      <h1>VIDREC LITE</h1>
    </div>
    <div id="projectWrap">
      <input id="projectName" type="text" placeholder="Project name" maxlength="80" autocomplete="off" spellcheck="false" />
      <span id="today"></span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tabRec" role="tab">Recorder</button>
      <button class="tab" id="tabTele" role="tab">Teleprompter</button>
    </div>
    <div class="group">
      <button class="btn icon" id="camBtn" title="Camera on / off"></button>
      <button class="btn icon" id="setBtn" title="Settings"></button>
      <button class="btn icon" id="fsBtn" title="Fullscreen (F)"></button>
    </div>
  </header>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="noCam"><span class="lbl">Camera is off</span><button class="btn" id="noCamBtn">Turn camera on</button></div>
    <div id="vscrim"></div>

    <div id="scanlines" class="prompter"></div>
    <div id="readline" class="prompter"><div class="tri r"></div><div class="rule"></div><div class="tri l"></div></div>
    <div id="content" class="prompter">
      <div class="spacer-top"></div>
      <div id="script"></div>
      <div class="spacer-bottom"></div>
    </div>

    <video id="playback" playsinline></video>
    <div id="recBadge"><span class="rd"></span><span id="recTime">00:00</span><span id="recLabel"></span></div>
    <div id="reviewBadge">▶ PLAYBACK · <span id="reviewLabel"></span></div>
    <button class="btn" id="liveBtn" title="Back to the live camera">Back to live</button>

    <div id="countdown"><span id="countNum"></span></div>
    <div id="toast"><span id="toastMsg"></span><button id="toastClose" title="Dismiss">✕</button></div>

    <div id="editor">
      <div class="top">
        <h2>SCRIPT</h2>
        <div class="group">
          <button class="btn" id="clearBtn">Clear</button>
          <button class="btn primary" id="doneBtn">Done</button>
        </div>
      </div>
      <textarea id="scriptInput" placeholder="Paste or type your script here…"></textarea>
      <p class="tip">Teleprompter tip · Space = scroll play/pause · ↑↓ = speed · +/− = size · F = fullscreen · M = mirror</p>
    </div>
  </div>

  <div id="settings">
    <div class="ctrl" style="min-width:auto"><span class="name">3·2·1 Countdown</span>
      <button class="fontbtn toggle" id="cdBtn"></button></div>
    <div class="ctrl tele-only" style="min-width:auto"><span class="name">Scroll starts with record</span>
      <button class="fontbtn toggle" id="syncBtn"></button></div>
    <label class="ctrl tele-only"><span class="ico">A</span><span class="name">Size</span>
      <input type="range" id="sizeR" min="20" max="140"><span class="readout" id="sizeV"></span></label>
    <label class="ctrl tele-only"><span class="ico">↕</span><span class="name">Leading</span>
      <input type="range" id="lhR" min="100" max="240"><span class="readout" id="lhV"></span></label>
    <label class="ctrl tele-only"><span class="ico">⇆</span><span class="name">Width</span>
      <input type="range" id="wR" min="40" max="100"><span class="readout" id="wV"></span></label>
    <label class="ctrl tele-only"><span class="ico">◐</span><span class="name">Dim camera</span>
      <input type="range" id="dimR" min="0" max="90"><span class="readout" id="dimV"></span></label>
    <div class="ctrl tele-only" style="min-width:auto"><span class="name">Color</span>
      <div class="group" id="colorGroup"></div></div>
    <div class="ctrl tele-only" style="min-width:auto"><span class="name">Font</span>
      <div class="group" id="fontGroup"></div></div>
  </div>

  <div id="prompterBar">
    <div class="group">
      <button class="btn icon" id="tpPlayBtn" title="Scroll play / pause (Space)"></button>
      <button class="btn icon" id="tpResetBtn" title="Back to top of script"></button>
    </div>
    <div id="speedWrap">
      <span class="lbl">Scroll speed</span>
      <input type="range" id="speedR" min="5" max="200">
      <span class="readout" id="speedV"></span>
    </div>
    <div class="group">
      <button class="btn icon" id="mirrorHBtn" title="Mirror horizontal (M)"></button>
      <button class="btn icon" id="mirrorVBtn" title="Flip vertical"></button>
      <button class="btn" id="editBtn" title="Edit script"><span>✎</span><span class="txt">Script</span></button>
    </div>
  </div>

  <div id="takesBar">
    <span class="lbl">Takes</span>
    <div id="takes"></div>
  </div>

  <div id="transport">
    <div id="takeInfo">
      <div id="takeName"></div>
      <div id="takeSub"></div>
      <div id="seekRow" hidden>
        <input type="range" id="seekR" min="0" max="1000" value="0">
        <span class="readout" id="seekV">00:00 / 00:00</span>
      </div>
    </div>
    <div class="group">
      <button class="btn" id="recBtn" title="Start / stop recording"></button>
      <button class="btn" id="playBtn" title="Play / pause the selected take"></button>
      <button class="btn" id="saveBtn" title="Save the selected take"></button>
      <button class="btn danger" id="delBtn" title="Delete the selected take"></button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // --- inline SVG icons ---
  var I = {
    play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.3 2.6L3 8"/><path d="M3 3v5h5"/></svg>',
    set:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
    fs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>',
    fsExit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 01-2 2H3M21 8h-3a2 2 0 01-2-2V3M3 16h3a2 2 0 012 2v3M16 21v-3a2 2 0 012-2h3"/></svg>',
    cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>',
    camOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16v2a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h2m5.66 0H14a2 2 0 012 2v3.34l1 1L23 7v10M1 1l22 22"/></svg>',
    mH:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M16 7l4 5-4 5M8 7l-4 5 4 5"/></svg>',
    mV:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l5-4 5 4M7 16l5 4 5-4"/></svg>',
    rec:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg>',
    stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
    save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6"/></svg>'
  };
  function iconLabel(icon, text) { return icon + '<span class="txt">' + text + '</span>'; }

  var COLORS = { amber:"#FFB000", white:"#FAFAF4", green:"#52FA7C" };
  var FONTS = {
    sans:'"Archivo", system-ui, sans-serif',
    serif:'"Newsreader", Georgia, serif',
    mono:'"JetBrains Mono", monospace'
  };
  var SAMPLE = "Welcome to your teleprompter.\n\nTap SCRIPT in the bar below to type or paste your own script. Press RECORD and the text will scroll past the read line while you're recorded.\n\nUse SCROLL SPEED to match your natural pace, and open settings to change the text size.\n\nIf you're using a beam‑splitter rig, switch on MIRROR so the reflected text reads the right way around.\n\nLook just past the lens, breathe, and let the words come to you. You've got this.";

  // --- persisted state ---
  var DEFAULTS = { text:SAMPLE, speed:45, fontSize:52, lineHeight:1.5, widthPct:82,
    mirrorH:false, mirrorV:false, colorKey:"amber", fontKey:"sans", useCountdown:true, scrim:0.4,
    project:"", mode:"rec", scrollWithRec:true };
  var S = load();

  function load() {
    var base = Object.assign({}, DEFAULTS);
    try {
      // carry over settings from the standalone teleprompter if they exist
      var old = localStorage.getItem("teleprompter");
      if (old) Object.assign(base, JSON.parse(old));
      var raw = localStorage.getItem("vidrecorderlite");
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (e) {}
    return base;
  }
  function save() { try { localStorage.setItem("vidrecorderlite", JSON.stringify(S)); } catch (e) {} }

  // --- runtime (non-persisted) ---
  var tpPlaying = false, tpAtEnd = false, countdownTimer = null;
  var pos = 0, rafId = null, lastTs = null;
  var stream = null, cameraOn = false;
  var recording = false, recorder = null, chunks = [], recStart = 0, recInterval = null, pendingName = null;
  var takes = [], selectedId = null, nextId = 1;

  // --- elements ---
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), content = $("content"), scriptEl = $("script");
  var video = $("video"), vscrim = $("vscrim"), playback = $("playback");

  // --- helpers ---
  function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTime(s) { s = Math.max(0, Math.floor(s || 0)); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }
  function todayKey() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function projectName() { return (S.project || "").trim() || "Untitled"; }
  function safeFile(s) { return s.replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "-").replace(/\s+/g, " ").trim() || "Untitled"; }

  var toastTimer = null;
  function toast(msg, isErr) {
    $("toastMsg").textContent = msg;
    $("toast").className = "on" + (isErr ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").className = ""; }, isErr ? 9000 : 4500);
  }

  // ---------------------------------------------------------------------------
  // Take numbering: Take 1, 2, 3… per project, per day. The counter lives in
  // localStorage so reloading the page keeps counting instead of restarting.
  // ---------------------------------------------------------------------------
  function counterKey(project) { return "vrl-take:" + todayKey() + ":" + project.toLowerCase(); }
  function peekTakeNum(project) {
    var n = 0;
    try { n = parseInt(localStorage.getItem(counterKey(project)), 10) || 0; } catch (e) {}
    takes.forEach(function (t) { if (t.day === todayKey() && t.project.toLowerCase() === project.toLowerCase()) n = Math.max(n, t.num); });
    return n + 1;
  }
  function claimTakeNum(project) {
    var n = peekTakeNum(project);
    try { localStorage.setItem(counterKey(project), String(n)); } catch (e) {}
    return n;
  }

  // ---------------------------------------------------------------------------
  // Mode (Recorder / Teleprompter)
  // ---------------------------------------------------------------------------
  function setMode(m) {
    S.mode = m; save();
    var tele = m === "tele";
    $("tabRec").classList.toggle("sel", !tele);
    $("tabTele").classList.toggle("sel", tele);
    stage.classList.toggle("tele", tele);
    $("prompterBar").classList.toggle("on", tele);
    Array.prototype.forEach.call(document.querySelectorAll(".tele-only"), function (el) { el.style.display = tele ? "" : "none"; });
    if (!tele) tpStop(false);
    applyTransform();
  }

  // ---------------------------------------------------------------------------
  // Teleprompter
  // ---------------------------------------------------------------------------
  function applyTheme() { document.documentElement.style.setProperty("--accent", COLORS[S.colorKey] || COLORS.amber); }
  function applyText() {
    scriptEl.textContent = S.text || "Your script will appear here…";
    scriptEl.style.fontFamily = FONTS[S.fontKey] || FONTS.sans;
    scriptEl.style.fontSize = S.fontSize + "px";
    scriptEl.style.lineHeight = S.lineHeight;
    scriptEl.style.maxWidth = S.widthPct + "%";
  }
  function applyTransform() {
    var sx = S.mirrorH ? -1 : 1, sy = S.mirrorV ? -1 : 1;
    content.style.transform = "translateY(" + (-pos) + "px) scale(" + sx + "," + sy + ")";
  }
  function maxScroll() { return Math.max(0, content.scrollHeight - stage.clientHeight * 0.5); }

  function step(ts) {
    if (lastTs == null) lastTs = ts;
    var dt = (ts - lastTs) / 1000; lastTs = ts;
    pos += S.speed * dt;
    if (pos >= maxScroll()) { pos = maxScroll(); applyTransform(); tpStop(true); return; }
    applyTransform();
    rafId = requestAnimationFrame(step);
  }
  function tpStart() {
    if (tpAtEnd) { pos = 0; tpAtEnd = false; applyTransform(); }
    tpPlaying = true; $("tpPlayBtn").innerHTML = I.pause;
    lastTs = null; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(step);
  }
  function tpStop(ended) {
    tpPlaying = false; cancelAnimationFrame(rafId);
    if (ended) tpAtEnd = true;
    $("tpPlayBtn").innerHTML = I.play;
  }
  function tpReset() {
    cancelCountdown();
    tpStop(false); tpAtEnd = false; pos = 0; applyTransform();
  }
  function tpToggle() {
    if (countdownTimer) { cancelCountdown(); return; }
    if (tpPlaying) tpStop(false);
    else { goLive(); runCountdown(tpStart); }
  }

  // --- shared 3·2·1 countdown ---
  function runCountdown(done) {
    if (!S.useCountdown) { done(); return; }
    var n = 3, cd = $("countdown"), num = $("countNum");
    cd.style.display = "flex"; num.textContent = n; num.className = "pop";
    countdownTimer = setInterval(function () {
      n -= 1;
      if (n <= 0) { cancelCountdown(); done(); }
      else { num.textContent = n; num.className = ""; void num.offsetWidth; num.className = "pop"; }
    }, 800);
    updateTransport();
  }
  function cancelCountdown() {
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    $("countdown").style.display = "none";
    updateTransport();
  }

  // ---------------------------------------------------------------------------
  // Camera
  // ---------------------------------------------------------------------------
  function getCamera(withAudio) {
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: withAudio ? { echoCancellation: true, noiseSuppression: true } : false
    });
  }
  function ensureStream() {
    if (stream) return Promise.resolve(stream);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error("noapi"));
    // prefer video + audio (so takes have sound); fall back to video only
    return getCamera(true).catch(function () { return getCamera(false); }).then(function (s) {
      stream = s; video.srcObject = s; video.classList.add("on");
      cameraOn = true; updateCamUI();
      if (!s.getAudioTracks().length) toast("No microphone found — recording video without sound.", true);
      return s;
    });
  }
  function handleCamError(err) {
    if (err && err.message === "noapi") { toast("Camera isn't available here. Open the app over https or http://localhost.", true); }
    else {
      var blocked = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
      toast(blocked
        ? "Camera/mic permission is blocked. Allow it in the browser's address bar, then try again."
        : "Couldn't access the camera (" + (err && err.name ? err.name : "error") + ").", true);
    }
    cameraOn = false; updateCamUI();
  }
  function startCamera() { ensureStream().catch(handleCamError); }
  function stopCamera() {
    if (recording) stopRecording();
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null; video.classList.remove("on");
    cameraOn = false; updateCamUI();
  }
  function updateCamUI() {
    var b = $("camBtn");
    b.innerHTML = cameraOn ? I.cam : I.camOff;
    b.classList.toggle("active", cameraOn);
    stage.classList.toggle("camon", cameraOn);
  }

  // ---------------------------------------------------------------------------
  // Recording
  // ---------------------------------------------------------------------------
  function pickMime() {
    // MP4 first: it opens in nearly every editor and player. WebM as fallback.
    var t = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    for (var i = 0; i < t.length; i++) { try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(t[i])) return t[i]; } catch (e) {} }
    return "";
  }
  function tickRec() { $("recTime").textContent = fmtTime((Date.now() - recStart) / 1000); }

  function requestRecord() {
    if (recording) { stopRecording(); return; }
    if (countdownTimer) { cancelCountdown(); return; }
    if (!window.MediaRecorder) { toast("Recording isn't supported in this browser.", true); return; }
    goLive();
    ensureStream().then(function () {
      runCountdown(function () {
        startRecording();
        if (S.mode === "tele" && S.scrollWithRec) tpStart();
      });
    }).catch(handleCamError);
  }
  function startRecording() {
    if (!stream) return;
    chunks = [];
    var mime = pickMime();
    try { recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
    catch (e) { toast("Couldn't start the recorder (" + (e && e.name ? e.name : "error") + ").", true); return; }
    var project = projectName();
    pendingName = { project: project, num: claimTakeNum(project), day: todayKey() };
    recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    var info = pendingName;
    recorder.onstop = function () { finalizeRecording(info); };
    recorder.start(1000);
    recording = true; recStart = Date.now();
    $("recLabel").textContent = "· " + project + " – Take " + pendingName.num;
    tickRec(); recInterval = setInterval(tickRec, 500);
    updateTransport();
  }
  function stopRecording() {
    if (recorder && recording) {
      pendingName.duration = (Date.now() - recStart) / 1000;
      recording = false;
      try { recorder.stop(); } catch (e) {}
    }
    if (recInterval) { clearInterval(recInterval); recInterval = null; }
    if (S.mode === "tele" && S.scrollWithRec) tpStop(false);
    updateTransport();
  }
  function finalizeRecording(info) {
    if (!chunks.length) { toast("That take came out empty — try again.", true); updateTransport(); return; }
    var mime = (recorder && recorder.mimeType) || "video/webm";
    var isMp4 = mime.indexOf("mp4") >= 0;
    var blob = new Blob(chunks, { type: isMp4 ? "video/mp4" : "video/webm" });
    chunks = [];
    var t = {
      id: nextId++, project: info.project, num: info.num, day: info.day,
      name: info.project + " - Take " + info.num,
      ext: isMp4 ? "mp4" : "webm", type: blob.type, blob: blob, url: URL.createObjectURL(blob),
      duration: info.duration || 0, saved: false
    };
    takes.push(t);
    renderTakes();
    selectTake(t.id);
    updateProjectHint();
  }

  // ---------------------------------------------------------------------------
  // Takes: select / review / save / delete
  // ---------------------------------------------------------------------------
  function selected() { for (var i = 0; i < takes.length; i++) if (takes[i].id === selectedId) return takes[i]; return null; }

  function renderTakes() {
    var box = $("takes"); box.innerHTML = "";
    if (!takes.length) {
      var e = document.createElement("span"); e.className = "empty";
      e.textContent = "No takes yet — hit Record.";
      box.appendChild(e); return;
    }
    takes.forEach(function (t) {
      var b = document.createElement("button");
      b.className = "take" + (t.id === selectedId ? " sel" : "");
      b.title = t.name + (t.saved ? " (saved)" : " (not saved yet)");
      b.innerHTML = "<span></span><span class='meta'></span>" + (t.saved ? "<span class='ok'>✓</span>" : "");
      b.children[0].textContent = (takes.some(function (o) { return o.project !== t.project; }) ? t.project + " · " : "") + "Take " + t.num;
      b.children[1].textContent = fmtTime(t.duration);
      b.onclick = function () { selectTake(t.id); };
      box.appendChild(b);
      if (t.id === selectedId) b.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
  }

  function selectTake(id) {
    if (recording) return;
    selectedId = id;
    var t = selected();
    playback.pause();
    if (t) {
      playback.src = t.url;
      playback.currentTime = 0;
      $("reviewLabel").textContent = t.name;
      stage.classList.add("reviewing");
      tpStop(false);
    }
    renderTakes(); updateTransport();
  }
  function goLive() {
    playback.pause();
    stage.classList.remove("reviewing");
    updateTransport();
  }

  function togglePlayback() {
    var t = selected(); if (!t || recording) return;
    if (!stage.classList.contains("reviewing")) { stage.classList.add("reviewing"); tpStop(false); }
    if (playback.paused || playback.ended) { playback.play().catch(function () {}); }
    else playback.pause();
  }

  // Saving asks where to put the file (File System Access API — Chrome / Edge).
  // Other browsers fall back to a normal download.
  function saveTake() {
    var t = selected(); if (!t) return;
    var fileName = safeFile(t.name) + "." + t.ext;
    if (window.showSaveFilePicker) {
      var accept = {}; accept[t.type] = ["." + t.ext];
      window.showSaveFilePicker({ suggestedName: fileName, types: [{ description: "Video", accept: accept }] })
        .then(function (handle) {
          return handle.createWritable().then(function (w) {
            return w.write(t.blob).then(function () { return w.close(); });
          }).then(function () { markSaved(t, "Saved “" + handle.name + "”"); });
        })
        .catch(function (err) {
          if (err && err.name === "AbortError") return; // user cancelled the dialog
          if (err && err.name === "SecurityError") { downloadTake(t, fileName); return; }
          toast("Couldn't save (" + (err && err.name ? err.name : "error") + ").", true);
        });
    } else {
      downloadTake(t, fileName);
    }
  }
  function downloadTake(t, fileName) {
    var a = document.createElement("a");
    a.href = t.url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    markSaved(t, "Downloading “" + fileName + "”. To pick a folder each time, turn on “Ask where to save each file” in your browser's download settings.");
  }
  function markSaved(t, msg) { t.saved = true; renderTakes(); updateTransport(); toast(msg); }

  function deleteTake() {
    var t = selected(); if (!t) return;
    var msg = "Delete " + t.name + "?" + (t.saved ? "" : "\n\nIt hasn't been saved, so it will be gone for good.");
    if (!window.confirm(msg)) return;
    var idx = takes.indexOf(t);
    playback.pause(); playback.removeAttribute("src"); playback.load();
    URL.revokeObjectURL(t.url);
    takes.splice(idx, 1);
    var next = takes[idx] || takes[idx - 1];
    if (next) selectTake(next.id);
    else { selectedId = null; goLive(); renderTakes(); }
    toast(t.name + " deleted.");
  }

  // ---------------------------------------------------------------------------
  // Transport UI
  // ---------------------------------------------------------------------------
  function updateTransport() {
    var t = selected(), busy = recording || !!countdownTimer;
    var reviewing = stage.classList.contains("reviewing");

    var rb = $("recBtn");
    rb.innerHTML = iconLabel(recording ? I.stop : I.rec, recording ? "Stop" : countdownTimer ? "Cancel" : "Record");
    rb.classList.toggle("active", recording);
    $("recDot").className = "dot" + (recording ? " live" : "");
    $("recBadge").classList.toggle("on", recording);
    $("projectName").disabled = recording;

    var playing = reviewing && !playback.paused && !playback.ended;
    $("playBtn").innerHTML = iconLabel(playing ? I.pause : I.play, playing ? "Pause" : "Play");
    $("playBtn").disabled = !t || busy;
    $("saveBtn").innerHTML = iconLabel(I.save, t && t.saved ? "Save again" : "Save");
    $("saveBtn").disabled = !t || busy;
    $("delBtn").innerHTML = iconLabel(I.trash, "Delete");
    $("delBtn").disabled = !t || busy;

    if (recording) {
      $("takeName").textContent = pendingName.project + " - Take " + pendingName.num;
      $("takeSub").textContent = "Recording…";
      $("seekRow").hidden = true;
    } else if (t) {
      $("takeName").textContent = t.name;
      $("takeSub").textContent = fmtTime(t.duration) + " · " + (t.blob.size / 1048576).toFixed(1) + " MB · " + t.ext.toUpperCase() + " · " + (t.saved ? "saved ✓" : "not saved");
      $("seekRow").hidden = false;
      updateSeek();
    } else {
      $("takeName").textContent = projectName() + " - Take " + peekTakeNum(projectName());
      $("takeSub").textContent = "Next take · press Record";
      $("seekRow").hidden = true;
    }
  }
  function updateProjectHint() { if (!selected() && !recording) updateTransport(); }

  function mediaDuration() {
    var d = playback.duration, t = selected();
    // MediaRecorder files often report Infinity until fully scanned; use our own timing then.
    return isFinite(d) && d > 0 ? d : (t ? t.duration : 0);
  }
  var seeking = false;
  function updateSeek() {
    var d = mediaDuration(), c = playback.currentTime || 0;
    if (!seeking) $("seekR").value = d ? Math.round(clamp(c / d, 0, 1) * 1000) : 0;
    $("seekV").textContent = fmtTime(c) + " / " + fmtTime(d);
  }

  // ---------------------------------------------------------------------------
  // Fullscreen
  // ---------------------------------------------------------------------------
  function toggleFullscreen() {
    var app = $("app");
    if (!document.fullscreenElement) { app.requestFullscreen && app.requestFullscreen(); }
    else { document.exitFullscreen && document.exitFullscreen(); }
  }
  document.addEventListener("fullscreenchange", function () {
    $("fsBtn").innerHTML = document.fullscreenElement ? I.fsExit : I.fs;
    $("fsBtn").classList.toggle("active", !!document.fullscreenElement);
  });

  // ---------------------------------------------------------------------------
  // Settings UI
  // ---------------------------------------------------------------------------
  function buildSwatches() {
    var g = $("colorGroup"); g.innerHTML = "";
    Object.keys(COLORS).forEach(function (k) {
      var b = document.createElement("button");
      b.className = "swatch" + (S.colorKey === k ? " sel" : "");
      b.style.background = COLORS[k]; b.title = k;
      b.onclick = function () { S.colorKey = k; applyTheme(); applyText(); buildSwatches(); save(); };
      g.appendChild(b);
    });
  }
  function buildFonts() {
    var g = $("fontGroup"); g.innerHTML = "";
    Object.keys(FONTS).forEach(function (k) {
      var b = document.createElement("button");
      b.className = "fontbtn" + (S.fontKey === k ? " sel" : "");
      b.textContent = k; b.style.fontFamily = FONTS[k];
      b.onclick = function () { S.fontKey = k; applyText(); buildFonts(); save(); };
      g.appendChild(b);
    });
  }
  function bindRange(id, vId, get, set, fmt) {
    var r = $(id), v = $(vId);
    r.value = get(); v.textContent = fmt(get());
    r.oninput = function () { set(+r.value); v.textContent = fmt(+r.value); applyText(); save(); };
  }
  function bindToggle(id, key) {
    var b = $(id);
    function paint() { b.textContent = S[key] ? "ON" : "OFF"; b.classList.toggle("sel", S[key]); }
    b.onclick = function () { S[key] = !S[key]; paint(); save(); };
    paint();
  }
  function setSpeed(v) { S.speed = clamp(v, 5, 200); $("speedR").value = S.speed; $("speedV").textContent = S.speed; save(); }
  function setSize(v) { S.fontSize = clamp(v, 20, 140); $("sizeR").value = S.fontSize; $("sizeV").textContent = S.fontSize + "px"; applyText(); save(); }
  function toggleMirrorH() { S.mirrorH = !S.mirrorH; $("mirrorHBtn").classList.toggle("active", S.mirrorH); applyTransform(); save(); }

  // ---------------------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------------------
  function init() {
    $("setBtn").innerHTML = I.set; $("fsBtn").innerHTML = I.fs;
    $("tpPlayBtn").innerHTML = I.play; $("tpResetBtn").innerHTML = I.reset;
    $("mirrorHBtn").innerHTML = I.mH; $("mirrorVBtn").innerHTML = I.mV;
    $("mirrorHBtn").classList.toggle("active", S.mirrorH);
    $("mirrorVBtn").classList.toggle("active", S.mirrorV);
    $("today").textContent = todayKey();
    updateCamUI();

    applyTheme(); applyText(); applyTransform();

    // project name
    var pn = $("projectName");
    pn.value = S.project;
    pn.oninput = function () { S.project = pn.value; save(); updateProjectHint(); };
    pn.onkeydown = function (e) { if (e.key === "Enter") pn.blur(); };

    // mode tabs
    $("tabRec").onclick = function () { setMode("rec"); };
    $("tabTele").onclick = function () { setMode("tele"); };

    // ranges / toggles
    bindRange("speedR", "speedV", function () { return S.speed; }, function (v) { S.speed = v; }, function (v) { return v; });
    bindRange("sizeR", "sizeV", function () { return S.fontSize; }, function (v) { S.fontSize = v; }, function (v) { return v + "px"; });
    bindRange("lhR", "lhV", function () { return Math.round(S.lineHeight * 100); }, function (v) { S.lineHeight = v / 100; }, function (v) { return (v / 100).toFixed(1); });
    bindRange("wR", "wV", function () { return S.widthPct; }, function (v) { S.widthPct = v; }, function (v) { return v + "%"; });
    bindRange("dimR", "dimV", function () { return Math.round(S.scrim * 100); }, function (v) { S.scrim = v / 100; vscrim.style.background = "rgba(0,0,0," + (v / 100) + ")"; }, function (v) { return v + "%"; });
    vscrim.style.background = "rgba(0,0,0," + S.scrim + ")";
    bindToggle("cdBtn", "useCountdown");
    bindToggle("syncBtn", "scrollWithRec");
    buildSwatches(); buildFonts();

    // header buttons
    $("setBtn").onclick = function () { $("settings").classList.toggle("open"); $("setBtn").classList.toggle("active"); };
    $("fsBtn").onclick = toggleFullscreen;
    $("camBtn").onclick = function () { if (cameraOn) stopCamera(); else startCamera(); };
    $("noCamBtn").onclick = startCamera;
    $("toastClose").onclick = function () { $("toast").className = ""; };

    // transport
    $("recBtn").onclick = requestRecord;
    $("playBtn").onclick = togglePlayback;
    $("saveBtn").onclick = saveTake;
    $("delBtn").onclick = deleteTake;
    $("liveBtn").onclick = goLive;
    playback.onclick = togglePlayback;
    ["play", "pause", "ended"].forEach(function (ev) { playback.addEventListener(ev, updateTransport); });
    playback.addEventListener("timeupdate", updateSeek);
    playback.addEventListener("loadedmetadata", updateSeek);
    var seek = $("seekR");
    seek.oninput = function () {
      seeking = true;
      var d = mediaDuration();
      if (d) { playback.currentTime = (seek.value / 1000) * d; }
      seeking = false; updateSeek();
    };

    // teleprompter controls
    $("tpPlayBtn").onclick = tpToggle;
    $("tpResetBtn").onclick = tpReset;
    $("mirrorHBtn").onclick = toggleMirrorH;
    $("mirrorVBtn").onclick = function () { S.mirrorV = !S.mirrorV; $("mirrorVBtn").classList.toggle("active", S.mirrorV); applyTransform(); save(); };

    // script editor
    var ed = $("editor"), input = $("scriptInput");
    $("editBtn").onclick = function () { input.value = S.text; ed.classList.add("open"); input.focus(); };
    $("doneBtn").onclick = function () { S.text = input.value; applyText(); ed.classList.remove("open"); tpReset(); save(); };
    $("clearBtn").onclick = function () { input.value = ""; input.focus(); };
    input.oninput = function () { S.text = input.value; applyText(); save(); };

    // keyboard
    window.addEventListener("keydown", function (e) {
      var tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" && e.target.type === "text" || tag === "TEXTAREA" || ed.classList.contains("open")) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var k = e.key.toLowerCase();
      var tele = S.mode === "tele";
      if (e.code === "Space") {
        e.preventDefault();
        if (tele && !stage.classList.contains("reviewing")) tpToggle(); else togglePlayback();
      }
      else if (k === "f") toggleFullscreen();
      else if (tele && e.key === "ArrowUp") { e.preventDefault(); setSpeed(S.speed + 5); }
      else if (tele && e.key === "ArrowDown") { e.preventDefault(); setSpeed(S.speed - 5); }
      else if (tele && (e.key === "+" || e.key === "=")) setSize(S.fontSize + 4);
      else if (tele && e.key === "-") setSize(S.fontSize - 4);
      else if (tele && k === "m") toggleMirrorH();
    });

    window.addEventListener("resize", applyTransform);

    // warn before closing with unsaved takes (they only live in memory)
    window.addEventListener("beforeunload", function (e) {
      if (recording || takes.some(function (t) { return !t.saved; })) { e.preventDefault(); e.returnValue = ""; }
    });

    setMode(S.mode === "tele" ? "tele" : "rec");
    renderTakes(); updateTransport();
    if (!S.project) pn.focus();
    startCamera();
  }

  init();

  // installable desktop app + offline support (needs https or localhost; skipped for file://)
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
